<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GLYPHBLOOM — field studies in ascii, pixel &amp; bloom</title>
<link rel="stylesheet" href="src/style.css" />
</head>
<body>
<canvas id="stage"></canvas>

<div id="ui">
  <div class="frame"></div>

  <header class="top">
    <div class="brand">GLYPH<span class="dim">BLOOM</span><em>®</em></div>
    <div class="tagline">field studies in ascii · pixel · bloom</div>
    <div class="build">v1.0 / 2026</div>
  </header>

  <nav id="tabs" class="tabs"></nav>

  <aside class="meta">
    <div class="counter"><span id="idx">01</span><span class="dim">/06</span></div>
    <h1 id="title">TIDE</h1>
    <p id="subtitle" class="subtitle"></p>
    <div id="tags" class="tags"></div>
    <div class="specs" id="specs"></div>
  </aside>

  <footer class="bottom">
    <div class="keys">
      <span><b>1-5</b> field</span>
      <span><b>H</b> ui</span>
      <span><b>S</b> still</span>
      <span><b>SPACE</b> pause</span>
    </div>
    <div class="clock"><span id="clock">00:00.00</span> <span class="dim">/ t</span></div>
    <div class="res" id="res">3200×2000</div>
  </footer>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
